<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7fb">
    <title>Sign in | API Control Room</title>
    <style>
        :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172338; background: #f4f7fb; font-synthesis: none; text-rendering: optimizeLegibility; }
        * { box-sizing: border-box; }
        body { display: grid; min-height: 100vh; margin: 0; padding: 24px; place-items: center; }
        .card { width: min(100%, 420px); padding: 38px; border: 1px solid #e8edf4; border-radius: 18px; background: white; box-shadow: 0 18px 60px #233b5a12; }
        .brand { display: flex; align-items: center; gap: 11px; color: #55647a; font-size: 11px; font-weight: 750; letter-spacing: .12em; }
        .mark { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 11px; background: #3977e8; color: white; font-size: 16px; letter-spacing: 0; }
        h1 { margin: 31px 0 7px; font-size: 27px; letter-spacing: -.04em; }
        .subtitle { margin: 0 0 27px; color: #77859a; font-size: 13px; line-height: 1.6; }
        label { display: block; margin: 17px 0 7px; color: #46566d; font-size: 12px; font-weight: 650; }
        input { width: 100%; height: 44px; padding: 0 12px; border: 1px solid #dce3ec; border-radius: 8px; outline: none; color: #172338; font: inherit; font-size: 13px; }
        input:focus { border-color: #3977e8; box-shadow: 0 0 0 3px #3977e81c; }
        button { width: 100%; height: 45px; margin-top: 23px; border: 0; border-radius: 8px; background: #3977e8; color: white; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; }
        button:hover { background: #2868d9; }
        .message { margin-top: 15px; padding: 10px 12px; border-radius: 8px; background: #fff0f1; color: #b83e51; font-size: 12px; }
        .success { background: #e9f8f2; color: #138663; }
        .foot { margin-top: 23px; color: #77859a; font-size: 12px; text-align: center; }
        a { color: #3977e8; font-weight: 650; text-decoration: none; }
        a:hover { text-decoration: underline; }
        @media (max-width: 480px) { .card { padding: 28px 23px; } }
    </style>
</head>
<body>
<main class="card">
    <div class="brand"><span class="mark">A</span> API CONTROL ROOM</div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue to your API traffic dashboard.</p>
    <div class="message" th:if="${param.error}">Those credentials didn't match an account. Please try again.</div>
    <div class="message success" th:if="${param.registered}">Account created. Sign in to continue.</div>
    <div class="message success" th:if="${param.logout}">You have been signed out.</div>
    <form th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
    </form>
    <p class="foot">New to the control room? <a th:href="@{/register}">Create an account</a></p>
</main>
</body>
</html>
